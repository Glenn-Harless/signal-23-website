[build]
  publish = "build"
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  command = "npm start"
  targetPort = 8080
  port = 8888

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.mp3"
    [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/operator"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/operator/*"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/deaddrop"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/deaddrop/*"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signal-memory"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/signal-memory/*"
    [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Short alias for the privacy policy; the canonical page is /legal/privacy.
[[redirects]]
  from = "/privacy"
  to = "/legal/privacy"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
