services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "9823:8080"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.git
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - CHOKIDAR_USEPOLLING=true
